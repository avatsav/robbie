[package]
name = "robbie"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
dotenvy = "0.15"
futures-util = "0.3.34"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
textwrap = "0.16.4"
tui-markdown = { version = "0.3.12", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
unicode-width = "0.2.3"
