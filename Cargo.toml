[package]
name = "robbie"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream", "osc52", "use-dev-tty"] }
dotenvy = "0.15"
futures-util = "0.3.34"
httpdate = "1"
image = { version = "0.25", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
textwrap = "0.16.4"
tui-markdown = { version = "0.3.13", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util"] }
unicode-segmentation = "1"
unicode-width = "0.2.3"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
